[project]
name = "trabalho-final"
version = "0.1.0"
description = "Jogo educativo em Python 3.13+ com PyGame 2.6, distribuído como binário standalone via PyInstaller"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pygame>=2.6.1"]

[project.optional-dependencies]
build = ["pyinstaller>=6.16.0"]

[project.scripts]
build-bin = "build_bin:build"

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"
